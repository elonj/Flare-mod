name: Build My Flare APK

# 只做 Android APK：出包后可在 run 页面底部 Artifacts 下载
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"

env:
  # 注意：if 里不能直接用 secrets.*，必须先经 env 中转
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
  KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
  ALIAS: ${{ secrets.ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # 配了签名 secrets 就用你自己的 keystore；没配则跳过，
      # Gradle 会回退到 debug keystore 给 release 签名，APK 一样能装
      - name: Apply signing (optional)
        if: env.SIGNING_KEY != ''
        run: |
          printf '%s' "$SIGNING_KEY" | base64 -d > key.jks
          printf 'storeFile=key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEY_STORE_PASSWORD" "$ALIAS" "$KEY_PASSWORD" > signing.properties
          if [ -n "$GOOGLE_SERVICES" ]; then printf '%s' "$GOOGLE_SERVICES" > app/google-services.json; fi

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_VERSION: '1.0.0-myclone'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Show APK
        run: ls -lh app/build/outputs/apk/release/

      # 打印签名指纹：与仓库 secret 里那把 key 一致才说明固定签名生效
      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flare-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
