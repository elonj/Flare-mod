name: Build My Flare APK

on:
  workflow_dispatch:      # 也可以手动点按钮触发
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # 可选：如果配了签名 secrets，就用你自己的 keystore 签
      - name: Apply signing (optional)
        if: secrets.SIGNING_KEY != ''
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > key.jks
          printf 'storeFile=key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEY_STORE_PASSWORD" "$ALIAS" "$KEY_PASSWORD" > signing.properties

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_VERSION: '1.0.0-myclone'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flare-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
