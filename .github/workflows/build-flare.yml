name: Build My Flare APK

# 只做 Android APK：出包后可在 run 页面底部 Artifacts 下载
on:
  workflow_dispatch:
  push:
    branches: [master]
    # 只改这些文件时不必重新出包（build-flare.yml 与 .github/apply_signing.sh 不在此列）
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/static.yml"
      - ".github/workflows/plugin-sdk.yml"
      - ".github/workflows/crowdin-*.yml"
      - ".github/workflows/pr-quality.yml"
      - ".github/workflows/dependabot.yml"
      - ".github/workflows/fdroid-nonfoss-check.yml"
      - ".github/workflows/issue-edit-history.yml"

env:
  # 注意：if 里不能直接用 secrets.*，必须先经 env 中转
  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
  KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
  ALIAS: ${{ secrets.ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # 配了签名 secrets 就用你自己的 keystore；没配则跳过，
      # Gradle 会回退到 debug keystore 给 release 签名，APK 一样能装
      - name: Apply signing (optional)
        if: env.SIGNING_KEY != ''
        run: |
          printf '%s' "$SIGNING_KEY" | base64 -d > key.jks
          printf 'storeFile=key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEY_STORE_PASSWORD" "$ALIAS" "$KEY_PASSWORD" > signing.properties
          if [ -n "$GOOGLE_SERVICES" ]; then printf '%s' "$GOOGLE_SERVICES" > app/google-services.json; fi

      # versionName 从 fdroid.properties 自动读取，跟上游走：1.8.1 -> 1.8.1-mod
      # versionCode 仍用 run_number（单调递增），保证每次都能覆盖升级
      - name: Resolve version
        id: ver
        run: |
          VN=$(sed -n 's/^versionName=//p' fdroid.properties | tr -d '\r')
          echo "version_name=${VN}-mod" >> "$GITHUB_OUTPUT"
          echo "检测到上游版本 ${VN} → 输出 ${VN}-mod (versionCode=${{ github.run_number }})"

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_VERSION: ${{ steps.ver.outputs.version_name }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Show APK
        run: ls -lh app/build/outputs/apk/release/

      # 打印签名指纹：与仓库 secret 里那把 key 一致才说明固定签名生效
      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flare-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
